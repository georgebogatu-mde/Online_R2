<header>
  <h1>&#128176; Prețuri Materii Prime — MDE</h1>
  <div style="display:flex;align-items:center;gap:12px;">
    <span class="meta" id="updateMeta"></span>
    <span class="meta" id="cloudStatus" style="color:#a5f3c4;"></span>
    <button class="btn btn-hub" onclick="goHub()">&#8962; Panou Central</button>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="search-row">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="text" placeholder="Caută material, furnizor, proiect, observații..." oninput="render()">
      </div>
      <select id="supplier" onchange="render()"><option value="">Toți furnizorii</option></select>
      <select id="catFilter" onchange="render()" style="display:none;"><option value="">Toate categoriile</option></select>
    </div>
    <div class="actions">
      <button class="btn btn-add" onclick="openManual()">&#10133; Adaugă material</button>
      <button class="btn btn-primary" onclick="document.getElementById('xlsx').click()">&#11014; Importă Excel (actualizare)</button>
      <input type="file" id="xlsx" accept=".xlsx,.xls" style="display:none" onchange="importExcel(event)">
      <button class="btn btn-light" onclick="exportExcel()">&#11015; Exportă Excel</button>
      <button class="btn btn-warn" onclick="resetData()">&#8635; Revino la datele inițiale</button>
      <span class="hint">Materialele adăugate manual se salvează în cloud și se văd la toți utilizatorii.</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-detailed" onclick="switchTab('detailed')">Listă Prețuri</button>
    <button class="tab" id="tab-central" onclick="switchTab('central')">Centralizat pe Material</button>
    <span class="count" id="count"></span>
  </div>

  <div class="table-card">
    <table id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
  </div>
</div>

<div class="modal-bg" id="manualBg" onclick="if(event.target===this)closeManual()">
  <div class="modal">
    <h2>&#10133; Adaugă material manual</h2>
    <p class="sub">Pentru materiale/prețuri pe care nu le primești pe email. Se salvează în acest browser și rămân și după actualizările automate.</p>
    <div class="fgrid">
      <div class="field full"><label>Material / Denumire *</label><input id="m_mat" type="text" placeholder="ex. EPDM-W 5mm"></div>
      <div class="field"><label>Lățime (mm)</label><input id="m_lat" type="text" placeholder="ex. 1000"></div>
      <div class="field"><label>Lungime (m)</label><input id="m_lung" type="text" placeholder="ex. 20"></div>
      <div class="field"><label>Grosime (mm)</label><input id="m_gros" type="text" placeholder="ex. 5"></div>
      <div class="field"><label>Format</label><input id="m_fmt" type="text" placeholder="ex. rolă / plăci"></div>
      <div class="field"><label>Preț *</label><input id="m_pret" type="text" placeholder="ex. 7.70"></div>
      <div class="field"><label>U.M.</label><input id="m_um" type="text" placeholder="ex. €/mp" value="€/mp"></div>
      <div class="field"><label>MOQ</label><input id="m_moq" type="text" placeholder="ex. 20 mp"></div>
      <div class="field"><label>Furnizor</label><input id="m_furn" type="text" placeholder="ex. Koepp"></div>
      <div class="field full"><label>Proiect Ref.</label><input id="m_proj" type="text" placeholder="ex. PRJ 2800"></div>
      <div class="field full"><label>Observații</label><input id="m_obs" type="text"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-light" onclick="closeManual()">Anulează</button>
      <button class="btn btn-add" onclick="saveManualForm()">Salvează materialul</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

var STORE_MANUAL = 'mde_preturi_manual_v1';
var DATA_VERSION = '2026-10-21';
var state = { tab:'detailed', data:null, sortKey:null, sortDir:1 };

var COLS = {
  detailed: [
    {k:'mat', label:'Material / Denumire', cls:'mat'},
    {k:'dim', label:'Dimensiuni (L×l×g)'},
    {k:'fmt', label:'Format'},

    {k:'cat', label:'Categorie'},
    {k:'pret', label:'Preț', cls:'price'},
    {k:'um', label:'U.M.'},
    {k:'fmt', label:'Format / Dimensiuni'},
    {k:'furn', label:'Furnizor'},
    {k:'proj', label:'Proiect / Context'}
  ]
};

function loadBase(){
  try { var s = localStorage.getItem(STORE_KEY); if(s){ var o=JSON.parse(s); if(o && o._v===DATA_VERSION){ return o; } } } catch(e){}
  return JSON.parse(JSON.stringify(EMBEDDED));
}
function loadManual(){
  try { var s=localStorage.getItem(STORE_MANUAL); if(s){ var a=JSON.parse(s); if(Array.isArray(a)) return a; } } catch(e){}
  return [];
}
function saveManual(){
  try{ localStorage.setItem(STORE_MANUAL, JSON.stringify(state.manual)); }catch(e){}
  sbSaveShared(STORE_MANUAL, state.manual); // partajat între utilizatori
}
// Aduce lista de materiale manuale din cloud (comună tuturor) și reîmprospătează
async function syncManualFromCloud(){
  var v=await sbLoadShared(STORE_MANUAL);
  if(Array.isArray(v)){
    state.manual=v;
    try{ localStorage.setItem(STORE_MANUAL, JSON.stringify(v)); }catch(e){}
    applyData(); buildSupplierFilter(); render();
    setCloudStatus(true);
  }
}
function subscribeManual(){
  try{ var sb=_getSb(); if(!sb) return;
    sb.channel('preturi_manual').on('postgres_changes',{event:'*',schema:'public',table:'shared_data',filter:'key=eq.'+STORE_MANUAL},function(){ syncManualFromCloud(); }).subscribe();
  }catch(e){}
}
function setCloudStatus(ok){ var e=document.getElementById('cloudStatus'); if(e) e.textContent = ok ? '☁ sincronizat' : ''; }
// Rebuild state.data = base + manual entries (manual always appended, survives version bumps)
function applyData(){
  var d={ detailed:(state.base.detailed||[]).slice(), central:(state.base.central||[]).slice(), _updated:state.base._updated, _v:state.base._v };
  state.manual.forEach(function(m){ d.detailed.push(m); });
  state.data=d;
}
function loadData(){ state.base=loadBase(); state.manual=loadManual(); applyData(); return state.data; }
function saveData(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state.base)); }catch(e){ toast('Nu am putut salva în browser (spațiu plin).','err'); } }

function dimText(r){
  var p=[]; if(r.lat&&r.lat!=='–'&&r.lat!=='') p.push(r.lat); if(r.lung&&r.lung!=='–'&&r.lung!=='') p.push(r.lung); if(r.gros&&r.gros!=='–'&&r.gros!=='') p.push(r.gros);
  return p.join(' × ');
}

function init(){
  state.data = loadData();
  buildSupplierFilter();
  buildCatFilter();
  updateMeta();
  render();
  // sincronizare cloud a materialelor manuale (comune tuturor)
  syncManualFromCloud();
  subscribeManual();
}

function buildSupplierFilter(){
  var set={}; ['detailed','central'].forEach(function(t){ (state.data[t]||[]).forEach(function(r){ if(r.furn&&r.furn.trim()) set[r.furn.trim()]=1; }); });
  var sel=document.getElementById('supplier'); sel.innerHTML='<option value="">Toți furnizorii</option>';
  Object.keys(set).sort().forEach(function(s){ var o=document.createElement('option'); o.value=s; o.textContent=s; sel.appendChild(o); });
}
function buildCatFilter(){
  var set={}; (state.data.central||[]).forEach(function(r){ if(r.cat&&r.cat.trim()) set[r.cat.trim()]=1; });
  var sel=document.getElementById('catFilter'); sel.innerHTML='<option value="">Toate categoriile</option>';
  Object.keys(set).sort().forEach(function(s){ var o=document.createElement('option'); o.value=s; o.textContent=s; sel.appendChild(o); });
}
function updateMeta(){
  var d=state.data._updated; document.getElementById('updateMeta').textContent = (d ? ('Actualizat: '+d+' · ') : '')+'v'+DATA_VERSION+' · '+(state.data.detailed?state.data.detailed.length:0)+' prețuri';
}

function switchTab(t){
  state.tab=t; state.sortKey=null;
  document.getElementById('tab-detailed').classList.toggle('active', t==='detailed');
  document.getElementById('tab-central').classList.toggle('active', t==='central');
  document.getElementById('catFilter').style.display = (t==='central')?'block':'none';
  render();
}

function loose(s){ return String(s==null?'':s).toLowerCase().replace(/[\s\-_.\/]/g,''); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function hl(s, q){ s=esc(s); if(!q) return s; try{ var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); return s.replace(re,'<mark>$1</mark>'); }catch(e){ return s; } }

function render(){
  var q=document.getElementById('search').value.trim().toLowerCase();
  var sup=document.getElementById('supplier').value;
  var cat=document.getElementById('catFilter').value;
  var rows=(state.data[state.tab]||[]).slice();

  rows=rows.filter(function(r){
    if(sup && (r.furn||'').trim()!==sup) return false;
    if(state.tab==='central' && cat && (r.cat||'').trim()!==cat) return false;
    if(!q) return true;
    var hay=Object.keys(r).map(function(k){return r[k];}).join(' ').toLowerCase();
    if(state.tab==='detailed') hay+=' '+dimText(r).toLowerCase();
    var hayLoose=loose(hay);
    return q.split(/\s+/).every(function(t){ return hay.indexOf(t)>=0 || hayLoose.indexOf(loose(t))>=0; });
  });

  if(state.sortKey){
    var k=state.sortKey, dir=state.sortDir;
    rows.sort(function(a,b){
      var va=(k==='dim')?dimText(a):(a[k]||''), vb=(k==='dim')?dimText(b):(b[k]||'');
      var na=parseFloat(String(va).replace(',','.')), nb=parseFloat(String(vb).replace(',','.'));
      if(!isNaN(na)&&!isNaN(nb)) return (na-nb)*dir;
      return String(va).localeCompare(String(vb),'ro')*dir;
    });
  }

  var cols=COLS[state.tab];
  var thead=document.getElementById('thead');
  thead.innerHTML='<tr>'+cols.map(function(c){ var arr=state.sortKey===c.k?(state.sortDir>0?' ▲':' ▼'):''; return '<th onclick="sortBy(\''+c.k+'\')">'+esc(c.label)+arr+'</th>'; }).join('')+'</tr>';

  var tbody=document.getElementById('tbody');
  if(!rows.length){ tbody.innerHTML='<tr><td colspan="'+cols.length+'" class="empty">Niciun rezultat. Încearcă alt termen.</td></tr>'; }
  else {
    tbody.innerHTML=rows.map(function(r){
      return '<tr>'+cols.map(function(c){
        var val = (c.k==='dim') ? dimText(r) : (r[c.k]||'');
        if(c.k==='um') return '<td class="um">'+esc(val)+'</td>';
        if(c.k==='cat') return '<td>'+(val?'<span class="cat-tag">'+esc(val)+'</span>':'')+'</td>';
        if(c.k==='furn') return '<td>'+(val?'<span class="badge">'+esc(val)+'</span>':'')+'</td>';
        if(c.k==='mat' && r._man) return '<td class="mat"><span class="man-tag">manual</span>'+hl(val,q)+'<button class="man-del" title="Șterge material manual" onclick="deleteManual(\''+r._mid+'\')">&#10006;</button></td>';
        if(c.cls) return '<td class="'+c.cls+'">'+hl(val,q)+'</td>';
        return '<td>'+hl(val,q)+'</td>';
      }).join('')+'</tr>';
    }).join('');
  }
  document.getElementById('count').textContent = rows.length+' din '+(state.data[state.tab]||[]).length+' înregistrări';
}

function sortBy(k){ if(state.sortKey===k){ state.sortDir*=-1; } else { state.sortKey=k; state.sortDir=1; } render(); }

function norm(s){ return String(s==null?'':s).trim(); }

function importExcel(ev){
  var f=ev.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      var det=parseDetailed(wb), cen=parseCentral(wb);
      if(!det.length && !cen.length){ toast('Nu am găsit date recunoscute în fișier. Verifică structura.','err'); ev.target.value=''; return; }
      var nd={detailed: det.length?det:state.base.detailed, central: cen.length?cen:state.base.central};
      nd._updated=new Date().toLocaleDateString('ro-RO'); nd._v=DATA_VERSION;
      state.base=nd; applyData(); saveData(); buildSupplierFilter(); buildCatFilter(); updateMeta(); render();
      toast('Import reușit: '+det.length+' prețuri, '+cen.length+' centralizate.','ok');
    }catch(err){ toast('Eroare la citirea fișierului: '+err.message,'err'); }
    ev.target.value='';
  };
  rd.readAsArrayBuffer(f);
}

function findSheet(wb, names){
  for(var i=0;i<names.length;i++){ if(wb.SheetNames.indexOf(names[i])>=0) return wb.Sheets[names[i]]; }
  return null;
}
function sheetRows(ws){ return XLSX.utils.sheet_to_json(ws,{header:1,defval:''}); }
function headerIdx(rows){ for(var i=0;i<Math.min(rows.length,8);i++){ var line=rows[i].map(norm).join('|').toLowerCase(); if(line.indexOf('material')>=0) return i; } return 1; }

function parseDetailed(wb){
  var ws=findSheet(wb,['Prețuri Materii Prime','Preturi Materii Prime']) || wb.Sheets[wb.SheetNames[0]];
  if(!ws) return [];
  var rows=sheetRows(ws); var h=headerIdx(rows); var out=[];
  for(var i=h+1;i<rows.length;i++){ var r=rows[i]; if(r.every(function(c){return norm(c)==='';})) continue;
    var mat=norm(r[1]); if(!mat) continue;
    out.push({data:norm(r[0]),mat:mat,lat:norm(r[2]),lung:norm(r[3]),gros:norm(r[4]),fmt:norm(r[5]),pret:norm(r[6]),um:norm(r[7]),moq:norm(r[8]),furn:norm(r[9]),proj:norm(r[10]),obs:norm(r[11])});
  }
  return out;
}
function parseCentral(wb){
  var ws=findSheet(wb,['Centralizat pe Material']); if(!ws) return [];
  var rows=sheetRows(ws); var h=headerIdx(rows); var out=[]; var cat='';
  for(var i=h+1;i<rows.length;i++){ var r=rows[i]; var first=norm(r[0]);
    if(r.every(function(c){return norm(c)==='';})) continue;
    if(first.charAt(0)==='▸'){ cat=first.replace(/▸/g,'').trim(); continue; }
    if(!first) continue;
    out.push({cat:cat,mat:first,pret:norm(r[1]),um:norm(r[2]),fmt:norm(r[3]),furn:norm(r[4]),proj:norm(r[5])});
  }
  return out;
}

function exportExcel(){
  var wb=XLSX.utils.book_new();
  var d1=[['Data Email','Material / Denumire','Lățime (mm)','Lungime (m)','Grosime (mm)','Format','Preț','U.M.','MOQ','Furnizor','Proiect Ref.','Observații']];
  (state.data.detailed||[]).forEach(function(r){ d1.push([r.data,r.mat,r.lat,r.lung,r.gros,r.fmt,r.pret,r.um,r.moq,r.furn,r.proj,r.obs]); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(d1), 'Prețuri Materii Prime');
  var d2=[['Material / Denumire','Preț','U.M.','Format / Dimensiuni','Furnizor','Proiect / Context']]; var lastCat='';
  (state.data.central||[]).forEach(function(r){ if(r.cat&&r.cat!==lastCat){ d2.push(['▸  '+r.cat,'','','','','']); lastCat=r.cat; } d2.push([r.mat,r.pret,r.um,r.fmt,r.furn,r.proj]); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(d2), 'Centralizat pe Material');
  XLSX.writeFile(wb, 'MDE_Materii_Prime_Preturi_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

function resetData(){
  if(!confirm('Revii la datele inițiale și ștergi importurile salvate în acest browser?\n(Materialele adăugate manual rămân.)')) return;
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  state.base=JSON.parse(JSON.stringify(EMBEDDED)); applyData(); buildSupplierFilter(); buildCatFilter(); updateMeta(); render();
  toast('Datele inițiale au fost restaurate.','ok');
}

// ---- Materiale manuale ----
function openManual(){ document.getElementById('manualBg').classList.add('show'); setTimeout(function(){var e=document.getElementById('m_mat'); if(e) e.focus();},50); }
function closeManual(){
  document.getElementById('manualBg').classList.remove('show');
  ['m_mat','m_lat','m_lung','m_gros','m_fmt','m_pret','m_moq','m_furn','m_proj','m_obs'].forEach(function(id){ var e=document.getElementById(id); if(e){e.value=''; e.classList.remove('req-miss');} });
  var um=document.getElementById('m_um'); if(um) um.value='€/mp';
}
function gv(id){ var e=document.getElementById(id); return e?e.value.trim():''; }
function saveManualForm(){
  var mat=gv('m_mat'), pret=gv('m_pret');
  var ok=true;
  if(!mat){ document.getElementById('m_mat').classList.add('req-miss'); ok=false; } else document.getElementById('m_mat').classList.remove('req-miss');
  if(!pret){ document.getElementById('m_pret').classList.add('req-miss'); ok=false; } else document.getElementById('m_pret').classList.remove('req-miss');
  if(!ok){ toast('Completează cel puțin Material și Preț.','err'); return; }
  var D='–';
  var row={ data:new Date().toLocaleDateString('ro-RO'), mat:mat,
    lat:gv('m_lat')||D, lung:gv('m_lung')||D, gros:gv('m_gros')||D, fmt:gv('m_fmt'),
    pret:pret, um:gv('m_um')||'€/mp', moq:gv('m_moq')||D, furn:gv('m_furn'),
    proj:gv('m_proj'), obs:gv('m_obs'), _man:true, _mid:'m'+Date.now()+Math.floor(Math.random()*1000) };
  state.manual.push(row); saveManual(); applyData(); buildSupplierFilter(); render();
  closeManual();
  toast('Material adăugat manual.','ok');
}
function deleteManual(mid){
  if(!confirm('Ștergi acest material adăugat manual?')) return;
  state.manual=state.manual.filter(function(m){ return m._mid!==mid; });
  saveManual(); applyData(); buildSupplierFilter(); render();
  toast('Material șters.','ok');
}

function goHub(){ try{ window.location.href='index.html'; }catch(e){} }

var toastT;
function toast(msg,type){ var t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(type?(' '+type):''); clearTimeout(toastT); toastT=setTimeout(function(){ t.className='toast'; },3500); }

init();
</script>
